name: CI/CD for Game

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - "v*.*.*"

jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get install -y clang-format
      - name: Check Style
        run: |
          find src include -type f \( -name "*.cpp" -o -name "*.hpp" \) -exec clang-format --style=file --dry-run --Werror {} +

  build-linux:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Conan Packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            ${{ runner.os }}-conan-

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies
          cache-dependency-path: requirements.txt

      - name: Install Tools via pip
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build
        run: |
          conan profile detect --force
          conan install . --output-folder=build --build=missing -s build_type=Release -c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True
          cmake --preset conan-release
          cmake --build --preset conan-release --parallel

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-ubuntu-latest
          path: build/build/Release/Game

  build-windows:
    needs: lint
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Conan Packages
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\.conan2
          key: ${{ runner.os }}-conan-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            ${{ runner.os }}-conan-

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies
          cache-dependency-path: requirements.txt

      - name: Install Tools via pip
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build
        run: |
          conan profile detect --force
          conan install . -of . -b missing -s build_type=Release -s compiler.cppstd=20
          cmake --preset conan-default
          cmake --build --preset conan-release

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-windows-latest
          path: build/Release/Game.exe

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: game-windows-latest
          path: artifacts/game-windows-latest

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: game-ubuntu-latest
          path: artifacts/game-ubuntu-latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            artifacts/game-windows-latest/Game.exe
            artifacts/game-ubuntu-latest/Game
