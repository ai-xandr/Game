name: CI for Game

on: [ pull_request ]

jobs:
  diffs-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: fetch Game repo
        run: git fetch origin main

      - name: check git diffs
        run: |
          git diff --name-only origin/main...HEAD | grep -E "/.clang-format|CMakeLists\.txt|\.git|\.github|\.gitignore|README\.md|cripts" && exit 1 || exit 0

  build:
    needs: diffs-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: fetch Game repo
        run: git fetch origin main

      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            libudev-dev \
            libopengl-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            libflac-dev \
            libvorbis-dev \
            libopenal-dev
            
      - name: build via cmake
        run: |
          cmake -B build 
          cmake --build build --config Release
