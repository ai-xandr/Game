name: CI for Game

on: [ pull_request ]

jobs:
  diffs-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: fetch Game repo
        run: git fetch origin main

      - name: check git diffs
        run: |
          git diff --name-only origin/main...HEAD | grep -vE "^(src/|CMakeLists\.txt$)" || exit 0

  build:
    needs: diffs-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: fetch Game repo
        run: git fetch origin main

      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libudev-dev libopengl-dev libflac-dev libvorbis-dev libopenal-dev

      - name: build via cmake
        run: |
          cmake -B build 
          cmake --build build --config Release
