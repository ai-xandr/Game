name: CI for Game

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Deps
        run: |+
          sudo apt-get update
          sudo apt-get install -y -qq clang-format build-essential
                 
      - name: Check Code style via clang-format
        run: |
          find src include -type f \( -name "*.cpp" -o -name "*.hpp" \) -exec \
            clang-format --style=file --dry-run --Werror {} +

      - name: Use venv and build
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install conan ninja
          conan profile detect --force
          conan install . --output-folder=build --build=missing \
          -s build_type=Release \
          -c tools.system. package_manager:mode=install \
          -c tools.system.package_manager:sudo=True
          cmake --preset conan-default
          cmake --build --preset conan-release --parallel

      - name: Cache Conan Packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-conan-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            ${{ runner.os }}-conan-
